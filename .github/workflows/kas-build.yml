name: kas build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  KAS_CLONE_DEPTH: 1
  # kas 5.5, the image the script below is taken from.
  KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas@sha256:4b210b0be3c887875973c4f4c35470b4ecf3edd2346c9de1bdd33feae5b86e94
  # Shared cache mount on the self-hosted runners; holds the downloads
  # and sstate-cache folders so DL_DIR and SSTATE_DIR persist across
  # builds and both source fetches and prebuilt artifacts are reused.
  CACHE_DIR: /efs/foundries

jobs:
  kas-setup:
    runs-on:
      group: GHA-prd-foundriesio-SelfHosted-RG
      labels: [ self-hosted, qcom-u2404, amd64 ]
    strategy:
      fail-fast: false
      matrix:
        target:
          - qemuarm64-secureboot
          - qemux86-64
          - uno-q
    name: kas-setup ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          cid=$(docker create "$KAS_CONTAINER_IMAGE")
          docker cp "$cid:/usr/local/bin/kas-container" "$KAS_CONTAINER"
          docker rm "$cid"
          chmod +x "$KAS_CONTAINER"
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          grep -q "KAS_CONTAINER_SCRIPT_VERSION=\"${LATEST}\"" "$KAS_CONTAINER" ||
            echo "::notice::kas ${LATEST} is released; move KAS_CONTAINER_IMAGE to its digest."

      - name: Check the lockfiles pin every repo
        run: |
          # Without --update kas writes only the pins that are missing.
          "$KAS_CONTAINER" lock ci/${{ matrix.target }}.yml
          unpinned="$(git status --porcelain -- 'ci/*.lock.yml' 'ci/include/*.lock.yml')"
          if [ -n "$unpinned" ]; then
            echo "::error::ci/${{ matrix.target }}.yml has repos that no lockfile pins."
            echo "Run 'kas-container lock ci/${{ matrix.target }}.yml' and commit the result."
            git --no-pager diff -- 'ci/*.lock.yml' 'ci/include/*.lock.yml'
            exit 1
          fi

      - name: Upload kas-container
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kas-container-${{ matrix.target }}
          path: ${{ env.KAS_CONTAINER }}

  build:
    needs: kas-setup
    runs-on:
      group: GHA-prd-foundriesio-SelfHosted-RG
      labels: [ self-hosted, qcom-u2404, amd64 ]
    strategy:
      fail-fast: false
      matrix:
        target:
          - qemuarm64-secureboot
          - qemux86-64
          - uno-q
        # Targets booted in QEMU and updated by ci/scripts/qemu-test.sh.
        include:
          - target: qemux86-64
            qemu-test: true
    name: build ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download kas-container
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kas-container-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Set up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          chmod +x "$KAS_CONTAINER"

      - name: Set up build variables
        run: |
          echo "KAS_WORK_DIR=${{ runner.temp }}/kas-work-${{ matrix.target }}" >> $GITHUB_ENV
          mkdir -p "${CACHE_DIR}/downloads" "${CACHE_DIR}/sstate-cache"
          echo "DL_DIR=${CACHE_DIR}/downloads" >> $GITHUB_ENV
          echo "SSTATE_DIR=${CACHE_DIR}/sstate-cache" >> $GITHUB_ENV
          # ci/include/ci.yml holds the settings that suit a CI runner and
          # would be wrong for a developer's machine, so it composes here
          # rather than being included by base.yml.
          echo "KAS_YAMLS=ci/include/ci.yml:ci/${{ matrix.target }}.yml" >> $GITHUB_ENV

      - name: Dump resolved kas build yaml
        run: |
          mkdir -p "$KAS_WORK_DIR"
          "$KAS_CONTAINER" dump --resolve-env --resolve-local --resolve-refs "$KAS_YAMLS" > kas-build.yml

      - name: Upload resolved kas build yaml
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kas-build-${{ matrix.target }}
          path: kas-build.yml

      - name: kas build ${{ matrix.target }}
        run: |
          "$KAS_CONTAINER" build "$KAS_YAMLS"

      - name: Stage build artifacts for publishing
        run: |
          deploy_dir="${KAS_WORK_DIR}/build/tmp/deploy/images/${{ matrix.target }}"
          uploads_dir=./uploads/${{ matrix.target }}
          mkdir -p "$uploads_dir"
          # secureboot emits optee/ and trusted-firmware-a/ subdirs, so recurse.
          # ostree_repo is thousands of loose objects, one upload each.
          find "$deploy_dir" -mindepth 1 -maxdepth 1 ! -name ostree_repo \
            -exec cp -v -r --dereference {} "$uploads_dir"/ \;
          cp -v kas-build.yml "$uploads_dir"/

      - name: Set S3 object tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" = "pull_request" ]]; then
            echo "OBJECT_TAG=retention=7d" >> $GITHUB_ENV
            echo "BUILD_TYPE=buildType=PR" >> $GITHUB_ENV
          elif [[ "$GITHUB_EVENT_NAME" = "push" ]]; then
            echo "OBJECT_TAG=retention=15d" >> $GITHUB_ENV
            echo "BUILD_TYPE=buildType=PUSH" >> $GITHUB_ENV
          else
            echo "OBJECT_TAG=retention=15d" >> $GITHUB_ENV
            echo "BUILD_TYPE=buildType=OTHER" >> $GITHUB_ENV
          fi

      - name: Upload build artifacts to S3 bucket
        uses: qualcomm-linux/upload-private-artifact-action@3d4dd0fac6e01a66d2df1502e4189676202c8ae3 # aws-v5
        with:
          path: ./uploads
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.target }}/${{ github.run_id }}-${{ github.run_attempt }}/
          s3_bucket: qcom-prd-gh-artifacts
          object_tag: ${{ env.OBJECT_TAG }}
          build_type: ${{ env.BUILD_TYPE }}
          build_branch: "branch=${{ github.base_ref || github.ref_name }}"

      - name: QEMU update test ${{ matrix.target }}
        if: matrix.qemu-test
        run: ci/scripts/qemu-test.sh ${{ matrix.target }}

      - name: Upload QEMU test logs
        if: always() && matrix.qemu-test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qemu-test-${{ matrix.target }}
          path: ${{ env.KAS_WORK_DIR }}/qemu-test/logs
          if-no-files-found: ignore
