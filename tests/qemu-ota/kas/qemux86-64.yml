header:
  version: 14

# Boot through systemd-boot with OSTree's boot counting, as the UNO Q does,
# so a deployment that fails to boot falls back to the previous one.
local_conf_header:
  sota-boot-counting: |
    OSTREE_BOOTLOADER = "systemd-boot"
    EFI_PROVIDER = "systemd-boot"
    PACKAGECONFIG:append:pn-systemd = " efi"
    OSTREE_REPO_CONFIG:append = " sysroot.boot-counting-tries:3"
    OSTREE_OTA_REPO_CONFIG:append = " sysroot.boot-counting-tries:3"
    # A failed boot reboots: a kernel panic, or a fatal initramfs error.
    OSTREE_KERNEL_ARGS:append = " panic=5 init_fatal_reboot=1"

  sota-rootfs-space: |
    # Room for three OS versions and the test Apps. meta-updater's qemux86-64
    # class sets the image's extra space to 64 MiB.
    IMAGE_ROOTFS_EXTRA_SPACE:pn-core-image-full-cmdline = "1048576"
